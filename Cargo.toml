[workspace]
resolver = "3"
members = ["crates/sp-fidelity", "crates/sp-fidelity-wgpu", "crates/sp-fidelity-oracle"]
default-members = ["crates/sp-fidelity", "crates/sp-fidelity-wgpu"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/stevepryde/sp-fidelity"

[workspace.dependencies]
sp-fidelity = { version = "0.1.0", path = "crates/sp-fidelity" }
sp-fidelity-wgpu = { version = "0.1.0", path = "crates/sp-fidelity-wgpu" }
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=0.4.0"
serde_json = "1.0"
wgpu = { version = "=29.0.4", default-features = false }

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.bench]
overflow-checks = true
