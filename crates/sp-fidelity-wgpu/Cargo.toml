[package]
name = "sp-fidelity-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
description = "wgpu implementation of the FidelityFX SDK backend interface (FfxInterface)"
repository.workspace = true
readme = "README.md"
keywords = ["fsr2", "fidelityfx", "wgpu", "upscaling", "graphics"]
categories = ["graphics", "rendering"]
include = ["src/**", "LICENSE.txt", "README.md"]

[dependencies]
bytemuck.workspace = true
sp-fidelity.workspace = true
wgpu = { workspace = true, features = ["std", "wgsl", "dx12", "metal", "vulkan", "gles", "webgpu"] }
naga = { workspace = true, features = ["wgsl-in"] }
wgpu-naga-bridge = "30.0.1"

[dev-dependencies]
pollster.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
winit.workspace = true

[features]
default = []
frame-generation = ["sp-fidelity/frame-generation"]

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "fsr3"
required-features = ["frame-generation"]

[[example]]
name = "fsr3_present"
required-features = ["frame-generation"]
